<html>
<head>
<title>Maths</title>
</head>
<body>
<h1>Using Math Function</h1>
<script>
let str ="Hello Lil Bro";
let num=25;

document.write("Original string="+str+"<br>");
document.write("Length of string="+str.length +"<br>");
document.write("Upper case="+str.toUpperCase()+"<br>");
document.write("Lower case="+str.toLowerCase()+"<br>");
document.write("Character="+str.charAt(2)+"<br>");
document.write("<h2>MATHS FUNCTIONS</h2>")
document.write("Square root="+Math.sqrt(num)+"<br>");
document.write("Square="+Math.pow(2,3)+"<br>");
document.write("Round="+Math.round(2.3)+"<br>");
document.write("Maximum="+Math.max(2,3,105)+"<br>");



</script>

</body></html>
