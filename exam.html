<html>
<head>
<title>Online Exam</title>
</head>
<body>
<h2>Online exam</h2>
<form id="exam">
<p>Who are you ?</p>
<input type="radio" name="q1" value="1">Lil Bro<br>
<input type="radio" name="q1" value="0">Nigga<br>
<p>Who ate the nutella?</p>
<input type="radio" name="q2" value="1">Jhon<br>
<input type="radio" name="q2" value="0">Niggasuran<br>
<button type="button" onclick="check()">Submit</button>

</form>
<p id="result"></p>  
<script>
function onclick()
{
let score=0;

let answers=["q1","q2"];
for(let i=0;i<2;i++)
{
let selected = document.querySelector('input[name="'+answers[i]+'"]:checked');

if (selected && selected.value == "1")
{
score++;
}
}
document.getElementById("result").innerHTML=
"Your score bro:"+ score +"/2";
}
</script>
</body>
</html>
