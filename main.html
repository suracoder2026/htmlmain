<html>
<head>
<style>
.city {
  font-family: Copperplate, Papyrus, fantasy;
  font-size: 18px;
}

/* --- ENHANCED ANIMATED BULLET CSS --- */
.simple-list {
  list-style: none; /* Hide standard bullets */
  padding-left: 20px; /* Add breathing room inside the border */
  padding-top: 10px;
  padding-bottom: 10px;
}

.simple-list li {
  position: relative;
  padding-left: 30px; /* Make space for custom bullet */
  margin-top: 15px;   
  margin-bottom: 15px;
}

/* Clean up link styling to match your text */
.simple-list li a {
  text-decoration: none;
  color: #333;
  transition: color 0.3s ease;
}

/* Change link color to DodgerBlue on hover */
.simple-list li a:hover {
  color: DodgerBlue;
}

/* Create the custom sharp diamond bullet to match the font style */
.simple-list li::before {
  content: "◆"; 
  color: DodgerBlue; /* Matches your header color */
  font-size: 20px;
  position: absolute;
  left: 0;
  top: 50%;
  
  /* Link the subtle pulse animation */
  animation: fantasy-pulse 2s infinite ease-in-out;
}

/* Stagger the timing so they don't pulse all at once */
.simple-list li:nth-child(2)::before { animation-delay: 0.3s; }
.simple-list li:nth-child(3)::before { animation-delay: 0.6s; }
.simple-list li:nth-child(4)::before { animation-delay: 0.9s; }
.simple-list li:nth-child(5)::before { animation-delay: 1.2s; }

/* The scaling and subtle glowing animation sequence */
@keyframes fantasy-pulse {
  0%, 100% { 
    transform: translateY(-50%) scale(1); 
    text-shadow: 0 0 0px rgba(30, 144, 255, 0);
  }
  50% { 
    transform: translateY(-50%) scale(1.3); 
    text-shadow: 0 0 8px rgba(30, 144, 255, 0.6); /* Soft DodgerBlue glow */
  }
}
</style>
<title>MCET</title>
