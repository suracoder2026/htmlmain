<html>
<head>
<title>Background Color</title>
</head>
<body>

<h2>Change Background Color</h2>
<h3>To change the colour of the page click the buttons below</h3>
<button onclick="colorchange('red')">RED COLOR</button>
<button onclick="colorchange('purple')">PURPLE COLOR</button>
<button onclick="colorchange('magenta')">MAGENTA COLOR</button>
<script>
function colorchange(color)
{
document.body.style.backgroundColor=color;
}
</script>
</body>
</html>
