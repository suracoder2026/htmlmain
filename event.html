<html>
<head>
<title>JAVASCRIPT EVENT HANDLING</title>
<body>
<h1>EVENT HANDLING</h1>
<button onclick="clickevent()">CLICK here lil bro</button>
<p id="demo"></p>
<button onclick="mouseevent()">Move mouse here
</button>

<script>

function clickevent()
{
document.getElementById("demo").innerHTML="Button Clicked Lil bro!";
}


function mouseevent()
{
document.getElementById("demo").innerHTML="You moved Your Mouse bro!";
}

</script>

</body></html>
